server:
  port: 8080

spring:
  application:
    name: learnability-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:learnability;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration

  ai:
    google:
      genai:
        project-id: ${GEMINI_PROJECT_ID:learnability-pro-dev}
        api-key: ${GEMINI_API_KEY:mock-key-for-development}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-2.0-flash}
        embedding:
          api-key: ${GEMINI_API_KEY:mock-key-for-development}
          options:
            model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
    vectorstore:
      pgvector:
        table-name: vector_store
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: false

  autoconfigure:
    exclude: ${SPRING_AUTOCONFIGURE_EXCLUDE:org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration}

application:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
