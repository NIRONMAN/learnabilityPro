server:
  port: 8080

spring:
  application:
    name: learnability-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/learnability}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:mock-key-for-development}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-2.0-flash}
        embedding:
          options:
            model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
    vectorstore:
      pgvector:
        table-name: vector_store
        dimensions: 768
        distance-type: COSINE
        index-type: HNSW
        initialize-schema: false

application:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
