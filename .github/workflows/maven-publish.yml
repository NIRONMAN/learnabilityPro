
name: Maven CI/CD by niranjan

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build and publish Maven package
        run: mvn -B deploy --file pom.xml \
          -s $GITHUB_WORKSPACE/settings.xml
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Prepare deployment artifact
        run: |
          JAR=$(find target -maxdepth 1 \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name 'original-*' | head -n 1)

          test -n "$JAR"

          cp "$JAR" app.jar
          sha256sum app.jar > app.jar.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"

          gh release create "$TAG" \
            app.jar \
            app.jar.sha256 \
            --title "Automatic build $TAG" \
            --notes "Commit: $GITHUB_SHA"
