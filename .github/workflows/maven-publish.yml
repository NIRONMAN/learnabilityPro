name: Java Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Cancel outdated builds for the same branch
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configure Java 21 and Maven
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          server-id: github
          settings-path: ${{ github.workspace }}
          cache: maven
          cache-dependency-path: backend/pom.xml

      # 3. Build, test and publish Maven package
      - name: Build and publish Maven package
        run: |
          mvn -B clean deploy \
            --file backend/pom.xml \
            -s "$GITHUB_WORKSPACE/settings.xml"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # 4. Check if this is still the latest commit
      - name: Verify latest commit
        run: |
          git fetch origin main

          LATEST=$(git rev-parse origin/main)
          CURRENT=$(git rev-parse HEAD)

          if [ "$CURRENT" != "$LATEST" ]; then
            echo "A newer commit exists."
            echo "Skipping release."
            exit 1
          fi

          echo "Current commit is latest."

      # 5. Prepare executable JAR
      - name: Prepare deployment artifact
        run: |
          JAR=$(find backend/target -maxdepth 1 \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name 'original-*' \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "Executable JAR not found"
            exit 1
          fi

          cp "$JAR" app.jar

          sha256sum app.jar > app.jar.sha256

      # 6. Publish GitHub Release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

          gh release create "$TAG" \
            app.jar \
            app.jar.sha256 \
            --title "Backend Release $TAG" \
            --notes "Automated deployment build

          Commit: $GITHUB_SHA
          Branch: main
          Build: $GITHUB_RUN_NUMBER"

      # 7. Set up QEMU for multi-platform build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 8. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 9. Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 10. Extract Docker metadata
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/learnabilitypro-backend
            ghcr.io/${{ github.repository_owner }}/learnability-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value=${{ env.RELEASE_TAG }}

      # 11. Build and push multi-architecture Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JAR_FILE=app.jar
