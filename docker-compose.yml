version: '3.8'

services:
  backend:
    image: ghcr.io/nironman/learnabilitypro-backend:latest
    container_name: learnability-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - SERVER_PORT=28475
      - PORT=28475
    volumes:
      - ./uploads:/app/uploads
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    container_name: learnability-watchtower
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 180 --cleanup --label-enable
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=180
      - WATCHTOWER_LABEL_ENABLE=true
